<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>Pose Dance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./main.css?v=people-mode-2" />
</head>
  <body>
    <div
      id="bootLoading"
      class="boot-loading"
      role="status"
      aria-live="polite"
      aria-busy="true"
    >
      <div class="boot-loading__card">
        <div class="boot-loading__spinner" aria-hidden="true"></div>
        <div class="boot-loading__text" id="bootLoadingText">載入中…</div>
      </div>
    </div>
    <div class="app">
      <header class="topbar topbar--compact">
        <div class="topbar__controls">
          <div class="topbar__controls-group topbar__controls-group--left">
            <input
              id="videoUrlInput"
              class="topbar__url-input topbar__url-input--compact"
              type="text"
              placeholder="YouTube 網址"
            />
            <button id="loadVideoButton" class="btn btn-load" type="button">
              載入
            </button>
            <button id="pickSongButton" class="btn btn-load" type="button">
              挑選音樂
            </button>
            <input
              id="synthBpmInput"
              class="topbar__url-input topbar__bpm-input"
              type="number"
              min="40"
              max="300"
              value="120"
              title="BPM（選歌後可自動帶入；可手動改）"
            />
            <button id="addSynthTraceButton" class="btn btn-load" type="button">
              生成舞者
            </button>
            <button
              id="skeletonSettingsButton"
              class="btn btn-load"
              type="button"
            >
              設置骨架
            </button>
            <!-- 隱藏：打分模式／舊頂欄控制（邏輯仍可能由設置視窗觸發） -->
            <select id="modeSelect" class="topbar__mode-select" hidden aria-hidden="true">
              <option value="mode2" selected>Mode 1</option>
              <option value="mode1">Mode 2</option>
            </select>
            <select id="hintModeSelect" class="topbar__mode-select" hidden aria-hidden="true">
              <option value="easy" selected>Easy</option>
              <option value="hard">Hard</option>
              <option value="user">使用者(姿勢)</option>
            </select>
            <button id="loadSkeletonButton" type="button" hidden>載入骨架</button>
            <button id="clearLoadedSkeletonButton" type="button" hidden>清除載入</button>
            <button id="deleteSelectedSkeletonButton" type="button" hidden>刪除選中骨架</button>
            <button id="toggleMode1DemoButton" type="button" hidden>隱藏骨架</button>
            <button id="loadMode2SkeletonButton" type="button" hidden>載入骨架</button>
            <button id="toggleMode2DemoABCButton" type="button" hidden>關閉/顯示骨架</button>
            <button id="restoreMode2BindingButton" type="button" hidden>恢復本首歌預設骨架</button>
            <span id="synthControls" hidden>
              <select id="synthGrooveSelect" title="律動類型">
                <option value="swing">Swing</option>
                <option value="bounce" selected>Bounce</option>
              </select>
              <select id="synthBounceDirSelect" title="Bounce 方向">
                <option value="down" selected>down</option>
                <option value="up">up</option>
              </select>
              <select id="synthFootSelect" title="踏步模式">
                <option value="plant" selected>釘地</option>
                <option value="single">單腳踏</option>
                <option value="double">原地交替</option>
              </select>
              <select id="synthFootSideSelect" title="單腳：左／右">
                <option value="L" selected>左腳</option>
                <option value="R">右腳</option>
              </select>
              <select id="synthPatternSelect" title="動作 Pattern">
                <option value="random">隨機</option>
                <option value="mix" selected>Mix（全部混合）</option>
                <option value="wave">左右揮手</option>
                <option value="surrender">雙手投降舉</option>
                <option value="clap">胸前拍手</option>
              </select>
            </span>
            <input
              id="skeletonFileInput"
              class="topbar__file-input"
              type="file"
              accept="application/json,.json"
              style="display: none"
            />
            <input
              id="mode2SkeletonFileInput"
              class="topbar__file-input"
              type="file"
              accept="application/json,.json"
              multiple
              style="display: none"
            />
          </div>
          <div class="topbar__controls-group topbar__controls-group--right">
            <button id="startCameraButton" class="btn btn-camera" type="button">
              啟動鏡頭
            </button>
            <label
              class="people-mode-toggle"
              title="單人：Heavy 評分／場景；雙人：Full 僅顯示骨架"
            >
              <span class="people-mode-toggle__side">單人</span>
              <input
                id="peopleModeToggle"
                class="people-mode-toggle__input"
                type="checkbox"
                role="switch"
                aria-checked="false"
                aria-label="單人／雙人鏡頭"
              />
              <span class="people-mode-toggle__track" aria-hidden="true"></span>
              <span class="people-mode-toggle__side">雙人</span>
            </label>
            <button
              id="nextGroupButton"
              class="btn btn-load"
              type="button"
              hidden
            >
              下一組
            </button>
            <label
              class="record-bind-toggle"
              title="綁歌曲：時間對齊影片；不綁：相對時間從 0 起算"
            >
              <span class="record-bind-toggle__label" id="bindSongLabel"
                >綁歌曲</span
              >
              <input
                id="bindSongToggle"
                class="record-bind-toggle__input"
                type="checkbox"
                checked
                role="switch"
                aria-checked="true"
                aria-label="錄製是否綁定歌曲時間"
              />
              <span class="record-bind-toggle__track" aria-hidden="true"></span>
            </label>
            <button
              id="recordButton"
              class="btn btn-record"
              type="button"
              disabled
            >
              開始錄製
            </button>
          </div>
        </div>
      </header>

      <div class="modal-backdrop" id="skeletonSettingsBackdrop" aria-hidden="true">
        <div
          class="modal modal--settings"
          role="dialog"
          aria-modal="true"
          aria-label="設置骨架"
        >
          <div class="modal__header">
            <div class="modal__title">設置骨架</div>
            <button
              class="modal__close"
              id="skeletonSettingsCloseButton"
              type="button"
            >
              關閉
            </button>
          </div>
          <div class="modal__body modal__body--settings">
            <section class="settings-section">
              <h3 class="settings-section__title">骨架</h3>
              <div class="settings-section__row">
                <button id="settingsLoadSkeletonButton" class="btn btn-load" type="button">
                  載入骨架
                </button>
                <button id="settingsToggleSkeletonButton" class="btn btn-load" type="button">
                  關閉／顯示骨架
                </button>
                <button id="settingsRestoreSkeletonButton" class="btn btn-load" type="button">
                  恢復本首歌預設骨架
                </button>
              </div>
            </section>
            <section class="settings-section">
              <h3 class="settings-section__title">生成舞者設置</h3>
              <label class="settings-check">
                <input id="synthRandomMixCheckbox" type="checkbox" checked />
                每次生成時隨機混和（律動／方向／踏腳）
              </label>
              <div class="settings-grid" id="synthManualSettings">
                <label class="settings-field">
                  <span>律動</span>
                  <select id="settingsGrooveSelect" class="topbar__url-input">
                    <option value="swing">Swing</option>
                    <option value="bounce" selected>Bounce</option>
                  </select>
                </label>
                <label class="settings-field" id="settingsBounceDirField">
                  <span>Bounce 方向</span>
                  <select id="settingsBounceDirSelect" class="topbar__url-input">
                    <option value="down" selected>down</option>
                    <option value="up">up</option>
                  </select>
                </label>
                <label class="settings-field">
                  <span>踏腳</span>
                  <select id="settingsFootSelect" class="topbar__url-input">
                    <option value="plant" selected>釘地</option>
                    <option value="single">單腳踏</option>
                    <option value="double">原地交替</option>
                  </select>
                </label>
                <label class="settings-field" id="settingsFootSideField">
                  <span>單腳哪一側</span>
                  <select id="settingsFootSideSelect" class="topbar__url-input">
                    <option value="L" selected>左腳</option>
                    <option value="R">右腳</option>
                  </select>
                </label>
                <label class="settings-field">
                  <span>動作</span>
                  <select id="settingsPatternSelect" class="topbar__url-input">
                    <option value="random">隨機</option>
                    <option value="mix" selected>Mix（全部混合）</option>
                    <option value="wave">左右揮手</option>
                    <option value="surrender">雙手投降舉</option>
                    <option value="clap">胸前拍手</option>
                  </select>
                </label>
              </div>
              <p class="settings-hint">
                主畫面按「生成舞者」會套用以上設定。已移除側一步。
              </p>
            </section>
          </div>
        </div>
      </div>

      <div class="modal-backdrop" id="songModalBackdrop" aria-hidden="true">
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-label="挑選音樂"
        >
          <div class="modal__header">
            <div class="modal__title">挑選音樂</div>
            <button
              class="modal__close"
              id="songModalCloseButton"
              type="button"
            >
              關閉
            </button>
          </div>
          <div class="modal__body">
            <aside class="modal__sidebar">
              <div class="modal__section-title">分類</div>
              <div class="modal__categories" id="songCategories"></div>
            </aside>
            <section class="modal__content">
              <div class="modal__search">
                <input
                  id="songSearchInput"
                  class="topbar__url-input"
                  type="text"
                  placeholder="搜尋歌名/作曲者（q）"
                />
                <button
                  id="songSearchButton"
                  class="btn btn-load"
                  type="button"
                >
                  搜尋
                </button>
              </div>
              <div class="modal__list" id="songList"></div>
              <div class="modal__footer">
                <button
                  id="songPrevPageButton"
                  class="btn btn-load"
                  type="button"
                >
                  上一頁
                </button>
                <div class="small" id="songPageText">—</div>
                <button
                  id="songNextPageButton"
                  class="btn btn-load"
                  type="button"
                >
                  下一頁
                </button>
              </div>
            </section>
          </div>
          <div
            id="songApplyingOverlay"
            class="modal-applying"
            hidden
            aria-live="polite"
            aria-busy="true"
          >
            <div class="modal-applying__spinner" aria-hidden="true"></div>
            <div class="modal-applying__text">載入音樂中</div>
          </div>
        </div>
      </div>

      <main class="main">
        <section class="main__stage main__stage--user" aria-label="使用者骨架">
          <div class="camera-wrapper camera-wrapper--full">
            <canvas
              id="scene_canvas"
              class="scene-canvas"
              aria-hidden="true"
            ></canvas>
            <video id="input_video" playsinline></video>
            <canvas id="output_canvas"></canvas>
            <canvas
              id="overlay_canvas"
              tabindex="0"
              aria-label="骨架互動區（Delete 可刪除選中示範）"
            ></canvas>

            <!-- 畫布內側底部：示範骨架縮放（依序 L1 / L2 / R1 / R2，中間留空） -->
            <div
              id="demoScaleBottom"
              class="demo-scale-bottom demo-scale-bottom--overlay"
              aria-label="示範骨架縮放"
            >
              <div class="demo-scale-bottom__left">
                <input
                  id="demoScaleL1"
                  type="range"
                  min="1.5"
                  max="3.3"
                  step="0.05"
                  value="3.3"
                />
                <input
                  id="demoScaleL2"
                  type="range"
                  min="1.5"
                  max="3.3"
                  step="0.05"
                  value="3.3"
                />
              </div>
              <div class="demo-scale-bottom__spacer" aria-hidden="true"></div>
              <div class="demo-scale-bottom__right">
                <input
                  id="demoScaleR1"
                  type="range"
                  min="1.5"
                  max="3.3"
                  step="0.05"
                  value="3.3"
                />
                <input
                  id="demoScaleR2"
                  type="range"
                  min="1.5"
                  max="3.3"
                  step="0.05"
                  value="3.3"
                />
              </div>
            </div>
          </div>
          <div class="hud small" id="poseInfoText">尚未開始偵測</div>
          <div
            class="hud small synth-pattern-hud"
            id="synthPatternHud"
            style="display: none"
            aria-live="polite"
          ></div>
        </section>
      </main>

      <!-- 右下角：可拖曳/縮放的 YouTube 小視窗 -->
      <div id="ytPlayerWrapper" class="yt-wrapper" aria-label="YouTube 播放器">
        <div class="yt-wrapper__drag-handle" id="ytDragHandle">
          <span class="small">YouTube</span>
        </div>
        <div id="player" class="yt-wrapper__player"></div>
        <div
          class="yt-wrapper__resize-handle yt-wrapper__resize-handle--tl"
          id="ytResizeHandleTL"
        ></div>
        <div
          class="yt-wrapper__resize-handle yt-wrapper__resize-handle--tr"
          id="ytResizeHandleTR"
        ></div>
        <div
          class="yt-wrapper__resize-handle yt-wrapper__resize-handle--bl"
          id="ytResizeHandleBL"
        ></div>
        <div
          class="yt-wrapper__resize-handle yt-wrapper__resize-handle--br"
          id="ytResizeHandle"
        ></div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision",
          "three": "https://esm.sh/three@0.170.0"
        }
      }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="./posedanceTest.js?build=people-mode-2"></script>
  </body>
</html>
