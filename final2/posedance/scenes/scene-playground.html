<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>Scene Playground — 游泳</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #e8eef6;
        --muted: #9aa8b8;
        --panel: rgba(8, 14, 24, 0.72);
        --accent: #5eb0e0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #060a12;
        color: var(--ink);
        font-family: "Segoe UI", "Noto Sans TC", sans-serif;
        overflow: hidden;
      }

      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .hud {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 2;
        max-width: min(420px, calc(100vw - 32px));
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }

      .hud h1 {
        margin: 0 0 6px;
        font-size: 1.05rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      .hud p {
        margin: 0 0 12px;
        font-size: 0.85rem;
        line-height: 1.45;
        color: var(--muted);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }

      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.85rem;
        cursor: pointer;
      }

      button:hover {
        border-color: rgba(94, 176, 224, 0.55);
        background: rgba(94, 176, 224, 0.12);
      }

      button.is-active {
        border-color: var(--accent);
        background: rgba(94, 176, 224, 0.22);
      }

      .status {
        margin-top: 4px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .status strong {
        color: #c8e7ff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="場景預覽"></canvas>

    <div class="hud">
      <h1>Scene Playground</h1>
      <p>
        游泳：平緩海浪＋沙海交界重新對齊。尚未接攝影機。
      </p>
      <div class="row">
        <button type="button" id="btnSwim" class="is-active">游泳場景</button>
        <button type="button" id="btnNone">清空</button>
        <button type="button" id="btnWire">海面線框</button>
      </div>
      <div class="status">
        目前：<strong id="labelText">swim</strong>
        · 站立點：木台中央（STAGE_ANCHOR）
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.170.0"
        }
      }
    </script>
    <script type="module">
      import { createSceneWorld, SCENE_LABELS } from "./sceneWorld.js";

      const canvas = document.getElementById("view");
      const labelText = document.getElementById("labelText");
      const btnSwim = document.getElementById("btnSwim");
      const btnNone = document.getElementById("btnNone");
      const btnWire = document.getElementById("btnWire");

      const world = createSceneWorld(canvas);
      let wireOn = false;

      function syncSize() {
        world.setSize(window.innerWidth, window.innerHeight);
      }

      function setActiveButtons(label) {
        btnSwim.classList.toggle("is-active", label === SCENE_LABELS.swim);
        btnNone.classList.toggle("is-active", label === SCENE_LABELS.none);
        labelText.textContent = label;
      }

      btnSwim.addEventListener("click", () => {
        const label = world.setScene(SCENE_LABELS.swim);
        setActiveButtons(label);
        world.setOceanWireframe(wireOn);
      });

      btnNone.addEventListener("click", () => {
        const label = world.setScene(SCENE_LABELS.none);
        setActiveButtons(label);
      });

      btnWire.addEventListener("click", () => {
        wireOn = !wireOn;
        btnWire.classList.toggle("is-active", wireOn);
        world.setOceanWireframe(wireOn);
      });

      window.addEventListener("resize", syncSize);
      syncSize();
      world.setScene(SCENE_LABELS.swim);
      setActiveButtons(SCENE_LABELS.swim);

      function loop() {
        world.frame();
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
