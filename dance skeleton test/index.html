<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PoseDance｜PoseDance 自動舞者</title><style>body{margin:0;background:#101a28;color:#edf5ff;font:16px system-ui}main{display:grid;grid-template-columns:350px 1fr;gap:18px;padding:20px}aside{padding:18px;background:#1b2b40;border-radius:12px}h1{font-size:24px;margin:0 0 14px}p{line-height:1.6}label{display:block;margin:12px 0}input,select,button{font:inherit;background:#233b55;color:white;border:1px solid #617d98;border-radius:5px;padding:7px;max-width:100%;box-sizing:border-box}input[type=number]{width:145px}button{margin:4px 1px;cursor:pointer}button:disabled{opacity:.45;cursor:default}#stage{height:70vh;min-height:440px;background:#182335;border-radius:12px;overflow:hidden}#seek{width:100%}.warn{color:#ffd48d;font-size:14px}.hint{font-size:14px;color:#bad0e5}#error{color:#ffb4b4;white-space:pre-wrap}pre{white-space:pre-wrap;font-size:12px}details{margin-top:14px}audio{display:none}@media(max-width:900px){main{grid-template-columns:1fr}#stage{height:60vh}}</style><style id="professor-demo-style">.warn,.hint,details,#song,#position,#performance,#current,#sources,#statusline,#download{display:none!important}label:has(#seed),label:has(#offset),label:has(#route){display:none!important}main{grid-template-columns:290px minmax(0,1fr);gap:20px;padding:24px}aside{padding:24px}h1{font-size:27px;line-height:1.3;margin-bottom:24px}label{margin:20px 0 12px}button{padding:10px 12px;margin:5px 2px}#stage{height:calc(100vh - 100px);min-height:480px}#reload{display:block;width:100%;margin:22px 0 12px}#audiofile{width:100%}#mode,#style{width:100%;margin-top:8px}#error:empty{display:none}@media(max-width:900px){main{grid-template-columns:1fr}#stage{height:65vh}}</style><script type="importmap">{"imports":{"three":"./three-bridge.mjs","three/addons/controls/OrbitControls.js":"https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js"}}</script><main><aside><h1>PoseDance 自動舞者</h1><label>舞風<select id="style"><option data-formal="true" value="breaking">Breaking</option><option data-formal="true" value="house" selected>House</option><option data-formal="true" value="ballet">Ballet Jazz</option><option data-formal="true" value="street">Street Jazz</option><option data-formal="true" value="locking">Locking</option><option data-formal="true" value="popping">Popping</option><option data-formal="true" value="middle">Middle Hip-Hop</option><option data-formal="true" value="la">LA-style Hip-Hop</option><option data-formal="true" value="krump">Krump</option><option data-formal="true" value="waack">Waack</option></select></label><p class="warn">十舞風已登錄正式持續分支。Waack 保留後續視覺品質細修項目；不代表BPM或音樂自然收尾已完成。</p><label>選擇音樂<input id="audiofile" type="file" accept="audio/*"></label><label>Seed<input id="seed" type="number" value="1" min="0" max="4294967295"></label><label>起始 Offset（歌曲秒）<input id="offset" type="number" value="0" min="0" step=".01"></label><label>路線<select id="route"><option value="mixed">正式Seed混合</option><option value="alternating">只觀察S→T→S</option><option value="self">只觀察既有S→S</option></select></label><select id="seconds" hidden><option value="180">持續</option></select><input id="bpm" hidden value="0"><select id="tempo" hidden><option value="native">原速</option></select><p class="hint">音樂只作主時鐘，不變速、不宣稱BPM跟拍。沒有音樂時可按下方按鈕使用本頁產生的120秒測試提示音。</p><button id="testaudio">使用測試音</button><button id="reload">載入舞蹈</button><div><button id="play">播放／繼續</button><button id="pause">暫停</button><button id="replay">重播</button><button id="stop">停止</button></div><label>顯示<select id="mode"><option value="mesh">SMPL 人體</option><option value="skeleton">24 joints 骨架</option></select></label><button id="download">下載播放紀錄</button><p class="warn">請觀察兩個新接縫的腳部、轉身、手臂及動作差異。CONTACT_UNVERIFIED。歌曲結束停於當下姿態，尚無自然收尾。正式混合路線由Seed決定合法後繼；待驗候選仍固定交替。</p><pre id="error"></pre><p style="font-size:12px;color:#91a6bc;margin-top:24px"><a style="color:inherit" href="./attribution.html" target="_blank">資料來源與授權</a></p></aside><section><div id="stage"></div><input id="seek" type="range" min="0" max="0" value="0" step="1"><p id="statusline"></p><p id="song"></p><p id="position"></p><p id="performance"></p><p id="current"></p><p class="hint" id="sources"></p><details><summary>來源與技術診斷</summary><pre id="diagnostics"></pre></details><audio id="audio"></audio></section></main><script type="module">const chosen=new URLSearchParams(location.search).get('style');if([...document.querySelector('#style').options].some(o=>o.value===chosen))document.querySelector('#style').value=chosen;import('./app.mjs').catch(e=>{window.bootError=e.stack;document.querySelector('#error').textContent=e.stack;});document.querySelector('#testaudio').onclick=()=>{const rate=8000,n=120*rate,b=new ArrayBuffer(44+n*2),v=new DataView(b),txt=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};txt(0,'RIFF');v.setUint32(4,36+n*2,true);txt(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);txt(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++){const phase=i%rate;v.setInt16(44+i*2,phase<240?Math.sin(i/rate*440*2*Math.PI)*2000*(1-phase/240):0,true);}const dt=new DataTransfer();dt.items.add(new File([b],'合成120秒提示音_不是歌曲拍點.wav',{type:'audio/wav'}));const f=document.querySelector('#audiofile');f.files=dt.files;f.dispatchEvent(new Event('change'));};</script></html>
