<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="posedance-release" content="1126"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>PoseDance｜跟著音樂，自在舞動</title><link rel="stylesheet" href="./style.css?v=184364649a0e3628f61980a8061ef3838d86f3f48788a3e143824412aedddad0"><script type="importmap">{"imports":{"three":"./three-bridge.mjs?v=5aed4835a202073a49c63f137a3990cf5009033c4b956708de47c773f389d449","three/addons/":"https://esm.sh/three@0.170.0/examples/jsm/"}}</script><link rel="license" href="./ATTRIBUTION.md"></head><body>
<main id="experience" aria-label="PoseDance舞蹈播放"><div id="stage" aria-label="可用滑鼠拖曳旋轉、滾輪縮放的3D舞者"></div>
<header class="top panel"><div class="settings"><label for="style">舞風</label><select id="style" aria-label="選擇舞風"></select><label for="bpm">BPM</label><div class="number"><button id="bpmDown" aria-label="BPM減少1">−</button><input id="bpm" type="number" min="60" max="130" step="any" value="110" inputmode="decimal" aria-label="歌曲BPM，60至130"><button id="bpmUp" aria-label="BPM增加1">＋</button></div></div><div class="display"><button id="actor" aria-pressed="false">顯示骨架</button><button id="reset">重設視角</button><button id="full">全螢幕</button><button id="options" aria-expanded="false" aria-controls="optionsPanel">演出設定</button></div></header>
<section id="optionsPanel" class="panel options" hidden><label>舞蹈起始時間（秒）<input id="startOffset" type="number" min="0" step="0.1" value="0"></label><label>演出長度<select id="length"><option value="180">3分鐘</option><option value="300">5分鐘</option></select></label><button id="apply">套用設定</button></section>
<div id="status" class="status" role="status" aria-live="polite" hidden></div>
<section id="videoWindow" class="video-window panel" aria-label="YouTube浮動播放器" hidden><div id="dragBar" class="drag-bar" tabindex="0" aria-label="拖曳移動影片視窗，方向鍵可移動"><span>YouTube</span></div><div id="youtube" class="youtube"></div><button id="resizeVideo" aria-label="拖曳調整影片寬度與高度，方向鍵可調整" title="調整影片大小">⤢</button></section>
<footer class="bottom panel"><form id="videoForm"><label for="url">YouTube網址</label><input id="url" type="url" placeholder="https://youtu.be/…" aria-label="YouTube影片網址" autocomplete="off" required><button id="load" type="submit">載入影片</button></form><div class="timeline-row"><output id="time">0:00 / 0:00</output><input id="timeline" type="range" min="0" max="0" step="0.01" value="0" disabled aria-label="演出時間軸"></div><div class="transport"><button id="play" class="primary" disabled>開始跳舞</button><button id="pause" disabled>暫停</button><button id="replay" disabled>重播</button><button id="stop" disabled>停止</button></div></footer>
</main><script type="module" src="./app.mjs?v=959a57444109f23ac3833591bbd4871f521d5330323babafff3f280f365721ad"></script></body></html>
